name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # needed to push to ghcr.io

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          build-args: |
            NEXT_PUBLIC_FULL_NAME=Joel Dettinger
            NEXT_PUBLIC_LINKEDIN_USERNAME=joeldettinger
            NEXT_PUBLIC_INSTAGRAM_USERNAME=joeldettinger
            NEXT_PUBLIC_PHOTOGRAPHY_DOMAIN=photosby.joeldettinger.de
          cache-from: type=gha,scope=photography
          cache-to: type=gha,mode=max,scope=photography

      - name: Deploy via Komodo (signed webhook → pull + redeploy stack "portfolio-photography")
        env:
          SECRET: ${{ secrets.KOMODO_WEBHOOK_SECRET }}
        run: |
          body=$(printf '{"ref":"refs/heads/main","after":"%s","repository":{"full_name":"%s"}}' "$GITHUB_SHA" "$GITHUB_REPOSITORY")
          sig="sha256=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$SECRET" | awk '{print $NF}')"
          code=$(curl -s -o /tmp/resp -w '%{http_code}' --max-time 30 -X POST \
            "https://hooks.joeldettinger.de/listener/github/stack/portfolio-photography/deploy" \
            -H 'Content-Type: application/json' -H 'X-GitHub-Event: push' \
            -H "X-Hub-Signature-256: $sig" --data "$body")
          cat /tmp/resp; echo; echo "HTTP $code"
          [ "$code" -lt 300 ]
